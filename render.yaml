# Render Blueprint: Postgres + the Naseej API + the web app (static site).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. See DEPLOY.md for the full steps.
databases:
  - name: naseej-db
    plan: free
    databaseName: naseej
    user: naseej

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: naseej-api
    runtime: node
    plan: free
    # Built from the repo root because the lockfile belongs to the npm workspace.
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: naseej-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: naseej-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: naseej-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: naseej-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: naseej-db
          property: password
      # The private connection inside Render needs no TLS. Set to "true" when connecting from outside.
      - key: DB_SSL
        value: "false"
      # Generated once by Render. The code falls back to a published default when this is unset, so never remove it.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h

  # ---------------------------------------------------------------- web app
  - type: web
    name: naseej-web
    runtime: static
    buildCommand: npm install --include=dev && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      # The app calls /api on its own domain; Render forwards it to the API service.
      # If your API ends up with a different address, change this one line (see DEPLOY.md).
      - type: rewrite
        source: /api/*
        destination: https://naseej-api.onrender.com/api/*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
