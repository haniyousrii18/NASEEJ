<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <title>مرجع · Marjea</title>
  <!-- Marja glass orbit mark: a medical file at the centre, five health signs orbiting it
       (document, heartbeat, capsule, stethoscope, drop). Sky #38CFE0 to deep #0F7E96. -->
  <defs>
    <linearGradient id="mj-core" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#5CDCEA"/>
      <stop offset="0.5" stop-color="#22A8BF"/>
      <stop offset="1" stop-color="#0F7E96"/>
    </linearGradient>
    <linearGradient id="mj-sat" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4FD6E6"/>
      <stop offset="1" stop-color="#127F96"/>
    </linearGradient>
    <linearGradient id="mj-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mj-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38CFE0"/>
      <stop offset="1" stop-color="#0F7E96"/>
    </linearGradient>
  </defs>

  <!-- orbit -->
  <circle cx="64" cy="64" r="44" stroke="url(#mj-ring)" stroke-width="2.4" opacity="0.85"/>
  <g fill="#38CFE0">
    <circle cx="90.3" cy="28.4" r="2"/>
    <circle cx="111.6" cy="76.4" r="2"/>
    <circle cx="64" cy="108" r="2"/>
    <circle cx="16.4" cy="76.4" r="2"/>
    <circle cx="37.7" cy="28.4" r="2"/>
  </g>

  <!-- centre: the file tile -->
  <rect x="42" y="42" width="44" height="44" rx="13" fill="url(#mj-core)"/>
  <rect x="42" y="42" width="44" height="44" rx="13" fill="url(#mj-shine)"/>
  <rect x="42.6" y="42.6" width="42.8" height="42.8" rx="12.4" stroke="#fff" stroke-opacity="0.55" stroke-width="1.2"/>
  <g stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M51 56v-5h5M77 56v-5h-5M51 72v5h5M77 72v5h-5"/>
    <path d="M58.5 55.5h7.5l4.5 4.5v12.5h-12z" fill="#fff" fill-opacity="0.18"/>
    <path d="M62 64.5h5M62 68.5h5"/>
  </g>

  <!-- satellites -->
  <g>
    <!-- top: document -->
    <circle cx="64" cy="20" r="12.5" fill="url(#mj-sat)"/>
    <circle cx="64" cy="20" r="12.5" fill="url(#mj-shine)"/>
    <circle cx="64" cy="20" r="11.9" stroke="#fff" stroke-opacity="0.5" stroke-width="1.1"/>
    <g stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M59.5 13.5h6l3.5 3.5v9.5h-9.5z"/>
      <path d="M62 20h4.5M62 23.5h4.5"/>
    </g>

    <!-- top end: heart with pulse -->
    <circle cx="105.8" cy="50.4" r="12.5" fill="url(#mj-sat)"/>
    <circle cx="105.8" cy="50.4" r="12.5" fill="url(#mj-shine)"/>
    <circle cx="105.8" cy="50.4" r="11.9" stroke="#fff" stroke-opacity="0.5" stroke-width="1.1"/>
    <g stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M105.8 57.6l-6.4-6.3a3.9 3.9 0 0 1 6.4-4.6 3.9 3.9 0 0 1 6.4 4.6z"/>
      <path d="M100.6 51.4h2.6l1.4-2.4 2 4.4 1.3-2h2.4"/>
    </g>

    <!-- bottom end: capsule -->
    <circle cx="89.9" cy="99.6" r="12.5" fill="url(#mj-sat)"/>
    <circle cx="89.9" cy="99.6" r="12.5" fill="url(#mj-shine)"/>
    <circle cx="89.9" cy="99.6" r="11.9" stroke="#fff" stroke-opacity="0.5" stroke-width="1.1"/>
    <g stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="83.4" y="96.2" width="13" height="6.8" rx="3.4" transform="rotate(-45 89.9 99.6)"/>
      <path d="M87.6 97.3l4.6 4.6"/>
    </g>

    <!-- bottom start: stethoscope -->
    <circle cx="38.1" cy="99.6" r="12.5" fill="url(#mj-sat)"/>
    <circle cx="38.1" cy="99.6" r="12.5" fill="url(#mj-shine)"/>
    <circle cx="38.1" cy="99.6" r="11.9" stroke="#fff" stroke-opacity="0.5" stroke-width="1.1"/>
    <g stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32.6 92.8v4a4 4 0 0 0 8 0v-4"/>
      <path d="M36.6 100.8v1.6a3.6 3.6 0 0 0 7.2 0v-2.6"/>
      <circle cx="43.8" cy="98.2" r="1.7"/>
    </g>

    <!-- top start: drop -->
    <circle cx="22.2" cy="50.4" r="12.5" fill="url(#mj-sat)"/>
    <circle cx="22.2" cy="50.4" r="12.5" fill="url(#mj-shine)"/>
    <circle cx="22.2" cy="50.4" r="11.9" stroke="#fff" stroke-opacity="0.5" stroke-width="1.1"/>
    <path d="M22.2 43.6c-2.6 3.4-4.6 6.1-4.6 8.4a4.6 4.6 0 0 0 9.2 0c0-2.3-2-5-4.6-8.4z" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/>
  </g>
</svg>
