<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="theme-color" content="#f7f9f8" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="نَسيج" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the saved theme (light / dark / system) before first paint to avoid a flash.
      // Keep in sync with src/context/ThemeContext.tsx.
      (function () {
        try {
          // The signed-in workspace (a signed-in #/ deep link) keeps its own choice; every other page uses the public one.
          var inApp = /^#\/(?!verify-email|reset-password|forgot-password)/.test(location.hash) && !!localStorage.getItem('naseej_token');
          var pref = localStorage.getItem(inApp ? 'naseej_ws_theme' : 'naseej_theme');
          if (inApp && pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = localStorage.getItem('naseej_theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && dark) m.setAttribute('content', '#101b22');
        } catch (e) {}
      })();
    </script>
    <title>Naseej | نَسيج — Connected Healthcare Platform</title>
    <meta name="description" content="منصة نسيج الصحية السحابية لربط الملفات الطبية وسجلات المرضى عبر المراكز والمستشفيات المتعددة بأعلى معايير الخصوصية والعزل التام." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
