<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="theme-color" content="#0f3e17" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="نَسيج" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash of the wrong theme.
      // Keep in sync with src/context/ThemeContext.tsx.
      (function () {
        try {
          var pref = localStorage.getItem('naseej_theme');
          if (pref !== 'light' && pref !== 'dark') pref = 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && dark) m.setAttribute('content', '#0e1410');
        } catch (e) {}
      })();
    </script>
    <title>Naseej | نَسيج — Connected Healthcare Platform</title>
    <meta name="description" content="منصة نسيج الصحية السحابية لربط الملفات الطبية وسجلات المرضى عبر المراكز والمستشفيات المتعددة بأعلى معايير الخصوصية والعزل التام." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
