name: CI

# Runs on every pull request and on pushes to main. Everything uses a throwaway PostgreSQL service and synthetic data.
# Each area is its own job so a failure points straight at what broke: frontend, backend, API, database, security.
# The final "CI passed" job is the single check to require in branch protection.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  frontend:
    name: Frontend (typecheck, tests and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p frontend
      - name: Unit tests
        run: npm --prefix frontend run test
      - name: Production build
        run: npm --prefix frontend run build

  backend:
    name: Backend (typecheck, build and unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p backend
      - name: Compile
        run: npm --prefix backend run build
      - name: Unit tests (no database, no network)
        run: npm --prefix backend run test:unit

  api:
    name: API (integration tests against PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naseej_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: naseej_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      STORAGE_DIR: ./storage/protected
      # AI stays off in CI: no provider, no key, no outbound calls.
      AI_PROVIDER: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply migrations and synthetic seed
        run: |
          npm --prefix backend run migrate
          npm --prefix backend run seed
      - name: API tests (auth, RBAC, tenant isolation, clinical wall, portals)
        run: npm --prefix backend run test

  database:
    name: Database (migrations, rollbacks and schema checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naseej_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: naseej_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      STORAGE_DIR: ./storage/protected
      AI_PROVIDER: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrate an empty database
        run: npm --prefix backend run migrate
      - name: Migrate again (must be a no-op)
        run: npm --prefix backend run migrate
      - name: Apply the synthetic seed
        run: npm --prefix backend run seed
      - name: Check the schema (versions, primary keys, indexes)
        run: npm --prefix backend run db:check
      - name: Roll every migration back, newest first
        run: npm --prefix backend run db:rollback-check
      - name: Migrate forward again after the rollback
        run: npm --prefix backend run migrate
      - name: Re-check the schema
        run: npm --prefix backend run db:check

  security:
    name: Security (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fail on high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  ci-passed:
    name: CI passed
    if: always()
    needs: [frontend, backend, api, database, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "One or more required jobs did not succeed."
              exit 1
            fi
          done
