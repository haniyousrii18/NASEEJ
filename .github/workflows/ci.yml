name: CI

# Runs on every pull request and on pushes to main. Everything uses a throwaway PostgreSQL service and synthetic data.
# Two jobs only, to keep Actions usage low: "Code checks" (no database) and "Database and API" (PostgreSQL).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  # onnxruntime-node (the local translation engine) would download optional GPU binaries at install time. Naseej runs it on the
  # CPU only, so skip that download: `npm ci` then needs no access to the NuGet feed (it timed out here and failed the audit job).
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  checks:
    name: Code checks (typecheck, unit tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck frontend
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit -p frontend
      - name: Typecheck backend
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit -p backend
      - name: Frontend unit tests
        if: ${{ !cancelled() }}
        run: npm --prefix frontend run test
      - name: Backend unit tests (no database, no network)
        if: ${{ !cancelled() }}
        run: npm --prefix backend run test:unit
      - name: Frontend production build
        if: ${{ !cancelled() }}
        run: npm --prefix frontend run build
      - name: Backend build
        if: ${{ !cancelled() }}
        run: npm --prefix backend run build
      - name: Fail on high or critical vulnerabilities in production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  database-api:
    name: Database and API (migrations, rollbacks, integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naseej_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: naseej_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      STORAGE_DIR: ./storage/protected
      # AI stays off in CI: no provider, no key, no outbound calls.
      AI_PROVIDER: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrate an empty database
        if: ${{ !cancelled() }}
        run: npm --prefix backend run migrate
      - name: Migrate again (must be a no-op)
        if: ${{ !cancelled() }}
        run: npm --prefix backend run migrate
      - name: Apply the synthetic seed
        if: ${{ !cancelled() }}
        run: npm --prefix backend run seed
      - name: Check the schema (versions, primary keys, indexes)
        if: ${{ !cancelled() }}
        run: npm --prefix backend run db:check
      - name: API tests (auth, patient record, vault, visit summary, QR sharing, assistant boundary)
        if: ${{ !cancelled() }}
        run: npm --prefix backend run test
      - name: Roll every migration back, newest first
        if: ${{ !cancelled() }}
        run: npm --prefix backend run db:rollback-check
      - name: Migrate forward again after the rollback
        if: ${{ !cancelled() }}
        run: npm --prefix backend run migrate
      - name: Re-check the schema
        if: ${{ !cancelled() }}
        run: npm --prefix backend run db:check
